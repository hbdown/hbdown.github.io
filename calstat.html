<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日历场次计算器 V3.4</title>
    <style>
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --bg: #f3f4f6;
            --card: #fff;
            --border: #e5e7eb;
            --text: #1f2937;
            --text-secondary: #6b7280;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --purple: #7c3aed;
            --radius-sm: 6px;
            --radius: 8px;
            --radius-lg: 12px;
            --cal-panel-width: 350px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text);
        }

        .app {
            display: flex;
            height: 620px;
            background: var(--card);
            border-radius: var(--radius-lg);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            position: relative;
        }

        .cal-panel {
            width: var(--cal-panel-width);
            min-width: 0;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            background: #fafafa;
            transition: width 0.3s ease;
            overflow: hidden;
        }

        .cal-header {
            padding: 12px 15px;
            font-weight: bold;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        .cal-title {
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            padding: 10px 0;
            background: #fff;
            border-bottom: 1px solid var(--border);
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 600;
            padding: 10px 10px 5px;
            border-bottom: 1px solid var(--border);
        }

        .cal-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            scrollbar-width: thin;
            scrollbar-color: #d1d5db transparent;
        }

        .cal-scroll::-webkit-scrollbar {
            width: 6px;
        }

        .cal-scroll::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 3px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }

        .day {
            --cell-bg: transparent;
            --cell-color: inherit;
            padding: 10px 0;
            cursor: pointer;
            border-radius: var(--radius-sm);
            font-size: 14px;
            text-align: center;
            transition: background 0.15s;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            position: relative;
            background: var(--cell-bg);
            color: var(--cell-color);
        }

        .day:hover {
            --cell-bg: #e5e7eb;
        }

        .day:active {
            --cell-bg: #d1d5db;
        }

        .day.sel {
            --cell-bg: var(--primary);
            --cell-color: #fff;
        }

        .day.sel:hover {
            --cell-bg: var(--primary-hover);
        }

        .day.drag-add {
            --cell-bg: #93c5fd;
            --cell-color: #fff;
        }

        .day.drag-remove {
            --cell-bg: #fca5a5;
            --cell-color: #fff;
        }

        .day.pressing {
            --cell-bg: #d1d5db;
        }

        body.touch-active .day:hover {
            --cell-bg: transparent;
        }

        body.touch-active .day.sel:hover {
            --cell-bg: var(--primary);
        }

        body.touch-active .day.drag-add:hover,
        body.touch-active .day.drag-add:active {
            --cell-bg: #93c5fd;
        }

        body.touch-active .day.drag-remove:hover,
        body.touch-active .day.drag-remove:active {
            --cell-bg: #fca5a5;
        }

        .day.out-of-month {
            opacity: 0.4;
        }

        .day.today {
            border: 1.5px solid var(--primary);
        }

        .day.hide {
            visibility: hidden;
            pointer-events: none;
        }

        .day.ph::before {
            content: attr(data-m);
            position: absolute;
            top: -2px;
            right: 2px;
            font-size: 9px;
            color: var(--primary);
            font-weight: bold;
        }

        .day.sel.ph::before {
            color: #fff;
        }

        .day::after {
            content: '';
            position: absolute;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            font-weight: bold;
            line-height: 1;
        }

        .day.holiday::after {
            content: '休';
            color: var(--primary);
        }

        .day.weekend-work::after {
            content: '班';
            color: #a87bf5;
        }

        .day.sel.holiday::after {
            color: var(--danger);
        }

        .day.sel.weekend-work::after {
            color: var(--warning);
        }

        .toggle-btn {
            position: absolute;
            top: 50%;
            left: var(--cal-panel-width);
            transform: translateY(-50%);
            z-index: 10;
            width: 12px;
            height: 60px;
            background: var(--card);
            border: 1px solid var(--border);
            border-left: none;
            border-radius: 0 var(--radius) var(--radius) 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            color: var(--text-secondary);
            transition: left 0.3s ease, background 0.2s;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.05);
        }

        .toggle-btn:hover {
            background: var(--bg);
            color: var(--primary);
        }

        .app.collapsed .cal-panel {
            width: 0;
            border-right: none;
        }

        .app.collapsed .toggle-btn {
            left: 0;
        }

        .right-panel {
            flex: 1;
            padding: 20px;
            max-width: 620px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow-y: auto;
        }

        .top-bar {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }

        .grp {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .grp label {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        input {
            padding: 6px 8px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15);
        }

        .input-error {
            border-color: rgba(239, 68, 68, 0.6) !important;
            box-shadow: 0 0 8px rgba(239, 68, 68, 0.3) !important;
            background-color: #fee2e2 !important;
        }

        @keyframes errorShake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-3px);
            }

            75% {
                transform: translateX(3px);
            }
        }

        .error-flash {
            animation: errorShake 0.3s ease 2;
        }

        .btn {
            padding: 7px 12px;
            border-radius: var(--radius-sm);
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: #fff;
            white-space: nowrap;
            transition: opacity 0.2s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background: var(--primary);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-danger {
            background: var(--danger);
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-success {
            background: var(--success);
        }

        .btn-success:hover {
            background: #059669;
        }

        .btn-warning {
            background: var(--warning);
        }

        .btn-warning:hover {
            background: #d97706;
        }

        .btn-ghost {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 6px 10px;
            font-size: 13px;
        }

        .btn-ghost:hover {
            background: #fee2e2;
            border-color: var(--danger);
            color: var(--danger);
        }

        .btn-ghost.btn-undo {
            border-color: var(--primary);
            color: var(--primary);
        }

        .btn-ghost.btn-undo:hover {
            background: #eff6ff;
        }

        .tbl {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .row {
            display: grid;
            grid-template-columns: 70px repeat(7, 1fr);
            gap: 4px;
            align-items: center;
        }

        .hdr div {
            text-align: center;
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .lbl {
            font-size: 12px;
            font-weight: bold;
            text-align: right;
            padding-right: 5px;
        }

        .row input {
            width: 100%;
            text-align: center;
            padding: 5px;
            font-size: 13px;
            background: #f9fafb;
            border: 1px solid transparent;
        }

        .row input[readonly] {
            pointer-events: none;
            border: none;
            font-weight: bold;
        }

        .batch-row,
        .special-sess-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 0;
            flex-wrap: wrap;
        }

        .batch-row label,
        .special-sess-row label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .batch-row input,
        .special-sess-row input[type="number"] {
            width: 60px;
            text-align: center;
        }

        .special-list {
            font-size: 11px;
            color: #4b5563;
            max-height: 60px;
            overflow-y: auto;
            padding-left: 5px;
            border-left: 2px solid var(--border);
        }

        .special-list span {
            display: inline-block;
            background: var(--bg);
            border-radius: 4px;
            padding: 2px 6px;
            margin: 2px;
            cursor: pointer;
            border: 1px solid var(--border);
            transition: all 0.2s;
        }

        .special-list span:hover {
            background: #fee2e2;
            border-color: var(--danger);
            color: var(--danger);
        }

        .bottom-stats {
            display: flex;
            gap: 10px;
            padding-top: 10px;
            border-top: 1px dashed var(--border);
        }

        .stat-card {
            flex: 1;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: #fafafa;
        }

        .stat-card label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .stat-card .num {
            font-size: 18px;
            font-weight: bold;
        }

        .stat-card.workdays .num {
            color: #059669;
        }

        .stat-card.holidays .num {
            color: #d97706;
        }

        .stat-card.weekend-work .num {
            color: var(--purple);
        }

        .stat-card.total-days .num {
            color: var(--primary);
        }

        .file-area {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: var(--text-secondary);
            flex-wrap: wrap;
        }

        .file-status {
            font-size: 12px;
            font-weight: 500;
        }

        .file-status.ok {
            color: var(--success);
        }

        .file-status.err {
            color: var(--danger);
        }

        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
        }

        .total {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary);
        }

        .status-text {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .mobile-expand-btn {
            display: none;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            padding: 8px 12px;
            font-size: 13px;
            cursor: pointer;
            width: 100%;
            text-align: center;
        }

        .mobile-collapse-btn {
            display: none;
        }

        @media (max-width: 768px) {
            body {
                align-items: flex-start;
                padding: 0;
            }

            .app {
                flex-direction: column;
                width: 100%;
                max-width: 100%;
                height: auto;
                min-height: 100vh;
                border-radius: 0;
                box-shadow: none;
            }

            .toggle-btn {
                display: none !important;
            }

            .cal-panel {
                width: 100% !important;
                border-right: none;
                border-bottom: 1px solid var(--border);
                height: 380px;
            }

            .app.mobile-collapsed .cal-panel {
                height: 0 !important;
                border-bottom: none;
                overflow: hidden;
            }

            .app.mobile-collapsed .mobile-expand-btn {
                display: block;
            }

            .mobile-collapse-btn {
                display: inline;
                font-size: 11px;
                padding: 2px 8px;
                border: none;
                color: var(--text-secondary);
                background: none;
                cursor: pointer;
            }

            .right-panel {
                width: 100%;
                max-width: 100%;
            }

            input[type="date"],
            input[type="number"] {
                font-size: 16px !important;
            }
        }
    </style>
</head>

<body>
    <div class="app mobile-collapsed" id="app">
        <button class="toggle-btn" id="toggleBtn" title="展开/收起日历" aria-label="展开或收起日历面板">◀</button>

        <div class="cal-panel" role="region" aria-label="日历选择面板">
            <div class="cal-header">
                <span>🗓️ 日历</span>
                <button class="mobile-collapse-btn" id="mobileCollapseBtn">收起 ▲</button>
            </div>
            <div id="calTitle" class="cal-title" aria-live="polite">2025年7月</div>
            <div class="weekdays" aria-hidden="true">
                <div>一</div>
                <div>二</div>
                <div>三</div>
                <div>四</div>
                <div>五</div>
                <div>六</div>
                <div>日</div>
            </div>
            <div class="cal-scroll" id="calScroll">
                <div class="grid" id="calGrid" role="listbox" aria-multiselectable="true" aria-label="日期选择网格"></div>
            </div>
        </div>

        <div class="right-panel">
            <button class="mobile-expand-btn" id="mobileExpandBtn">🗓️ 展开日历</button>

            <div class="top-bar">
                <div class="grp">
                    <label for="startDate">开始日期</label>
                    <input type="date" id="startDate">
                </div>
                <div class="grp">
                    <label for="endDate">结束日期</label>
                    <input type="date" id="endDate">
                </div>
                <button class="btn btn-primary" id="btnCalcRange">生成区间</button>
                <button class="btn btn-danger" id="btnClearAll">全部清除</button>
                <button class="btn btn-ghost" id="btnClearSelected"
                    style="border-color:var(--danger);color:var(--danger);">清除选中</button>
                <button class="btn btn-ghost btn-undo" id="btnUndo" title="撤销上一步操作">↩ 撤销</button>
            </div>

            <div class="tbl">
                <div class="row hdr">
                    <div></div>
                    <div>周一</div>
                    <div>周二</div>
                    <div>周三</div>
                    <div>周四</div>
                    <div>周五</div>
                    <div>周六</div>
                    <div>周日</div>
                </div>
                <div class="row" id="daysRow">
                    <div class="lbl">天数</div>
                    <input type="number" data-d="1" value="0" readonly aria-label="周一天数">
                    <input type="number" data-d="2" value="0" readonly aria-label="周二天数">
                    <input type="number" data-d="3" value="0" readonly aria-label="周三天数">
                    <input type="number" data-d="4" value="0" readonly aria-label="周四天数">
                    <input type="number" data-d="5" value="0" readonly aria-label="周五天数">
                    <input type="number" data-d="6" value="0" readonly aria-label="周六天数">
                    <input type="number" data-d="0" value="0" readonly aria-label="周日天数">
                </div>
                <div class="row" id="sessRow">
                    <div class="lbl">单日场次</div>
                    <input type="number" data-s="1" value="1" min="0" aria-label="周一场次">
                    <input type="number" data-s="2" value="1" min="0" aria-label="周二场次">
                    <input type="number" data-s="3" value="1" min="0" aria-label="周三场次">
                    <input type="number" data-s="4" value="1" min="0" aria-label="周四场次">
                    <input type="number" data-s="5" value="1" min="0" aria-label="周五场次">
                    <input type="number" data-s="6" value="1" min="0" aria-label="周六场次">
                    <input type="number" data-s="0" value="1" min="0" aria-label="周日场次">
                </div>

                <div class="batch-row">
                    <label for="batchSessInput">一键批量:</label>
                    <input type="number" id="batchSessInput" value="1" min="0">
                    <button class="btn btn-success" id="btnBatchApply">应用到全部单日场次</button>
                </div>
                <div class="special-sess-row">
                    <label>特殊场次:</label>
                    <input type="date" id="specialStartDate" title="开始日期">
                    <span style="font-size:12px;color:var(--text-secondary);">至</span>
                    <input type="date" id="specialEndDate" title="结束日期">
                    <input type="number" id="specialSessInput" value="1" min="0" style="width:50px;" title="场次">
                    <button class="btn btn-warning" id="btnAddSpecial">添加</button>
                </div>

                <div class="special-list" id="specialList" aria-label="特殊场次列表"></div>
            </div>

            <div class="bottom-stats" aria-label="统计信息">
                <div class="stat-card workdays"><label>工作日</label>
                    <div class="num" id="statWorkdays">0</div>
                </div>
                <div class="stat-card holidays"><label>公休日</label>
                    <div class="num" id="statHolidays">0</div>
                </div>
                <div class="stat-card weekend-work"><label>周末班</label>
                    <div class="num" id="statWeekendWork">0</div>
                </div>
                <div class="stat-card total-days"><label>总天数</label>
                    <div class="num" id="statTotalDays">0</div>
                </div>
            </div>

            <div class="file-area">
                <span>上传排班JSON:</span>
                <input type="file" id="jsonFile" accept=".json" style="font-size:12px;">
                <button class="btn-ghost" id="btnClearJson" title="清除导入的排班数据（硬编码保留）">×</button>
                <span class="file-status" id="fileStatus"></span>
            </div>

            <div class="bottom-bar">
                <div class="status-text" id="statusText" aria-live="polite">就绪</div>
                <div style="display:flex;align-items:center;gap:10px;">
                    <span style="font-size:14px;color:var(--text-secondary);">总场次：</span>
                    <div class="total" id="grandTotal">0</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        (() => {
            'use strict';

            // ==================== 配置 ====================
            const CONFIG = {
                interaction: {
                    moveThreshold: 10,
                    longPressMs: 400,
                    ghostClickGap: 350,
                    autoScrollEdge: 40,
                    autoScrollSpeed: 10,
                },
                render: {
                    scrollDelay: 50,
                    defaultMonthsBefore: 3,
                    defaultMonthsAfter: 6,
                    maxRenderDays: 365,
                },
                file: {
                    maxSizeKB: 500,
                },
                history: {
                    maxSteps: 50,
                }
            };

            // ==================== 硬编码放假安排（2026 年，国务院公布） ====================
            // 作为基础层，任何时候都生效；上传 JSON 时叠加在其上，导入优先
            const DEFAULT_HOLIDAYS = [
                '2026-01-01', '2026-01-02', '2026-01-03',
                '2026-02-15', '2026-02-16', '2026-02-17', '2026-02-18',
                '2026-02-19', '2026-02-20', '2026-02-21', '2026-02-22', '2026-02-23',
                '2026-04-04', '2026-04-05', '2026-04-06',
                '2026-05-01', '2026-05-02', '2026-05-03', '2026-05-04', '2026-05-05',
                '2026-06-19', '2026-06-20', '2026-06-21',
                '2026-09-25', '2026-09-26', '2026-09-27',
                '2026-10-01', '2026-10-02', '2026-10-03', '2026-10-04',
                '2026-10-05', '2026-10-06', '2026-10-07'
            ];

            const DEFAULT_WEEKEND_WORKDAYS = [
                '2026-01-04', '2026-02-14', '2026-02-28',
                '2026-05-09', '2026-09-20', '2026-10-10'
            ];

            // ==================== 状态管理 ====================
            const today = new Date();

            const state = {
                selected: new Set(),

                // 合并后的生效数据（硬编码 + 导入，供渲染/计算用）
                holidays: new Set(),
                weekendWorkdays: new Set(),

                // 导入的部分（不持久化，刷新丢失；用于和硬编码合并）
                importedHolidays: new Set(),
                importedWeekendWorkdays: new Set(),

                specialSessMap: new Map(),
                weekdaySess: { 1: 1, 2: 1, 3: 1, 4: 1, 5: 1, 6: 1, 0: 1 },

                renderRange: {
                    start: new Date(today.getFullYear(), today.getMonth() - CONFIG.render.defaultMonthsBefore, 1),
                    end: new Date(today.getFullYear(), today.getMonth() + CONFIG.render.defaultMonthsAfter + 1, 0),
                },
            };

            // 合并硬编码 + 导入，写入 state.holidays / state.weekendWorkdays
            // 导入优先：同一天两边都有时，Set 自动去重，值本身一致（都是日期字符串）
            function rebuildEffective() {
                state.holidays = new Set([...DEFAULT_HOLIDAYS, ...state.importedHolidays]);
                state.weekendWorkdays = new Set([...DEFAULT_WEEKEND_WORKDAYS, ...state.importedWeekendWorkdays]);
            }

            // 撤销历史栈
            const history = [];

            function pushHistory() {
                history.push({
                    selected: new Set(state.selected),
                    specialSessMap: new Map(state.specialSessMap),
                });
                if (history.length > CONFIG.history.maxSteps) history.shift();
            }

            function undo() {
                if (!history.length) {
                    setStatus('没有可撤销的操作');
                    return;
                }
                const prev = history.pop();
                state.selected = prev.selected;
                state.specialSessMap = prev.specialSessMap;
                renderSpecialList();
                syncUI();
                setStatus('已撤销');
            }

            // ==================== DOM 缓存 ====================
            const $ = id => document.getElementById(id);
            const dom = {
                app: $('app'),
                calGrid: $('calGrid'),
                calScroll: $('calScroll'),
                calTitle: $('calTitle'),
                toggleBtn: $('toggleBtn'),
                mobileExpandBtn: $('mobileExpandBtn'),
                mobileCollapseBtn: $('mobileCollapseBtn'),
                startDate: $('startDate'),
                endDate: $('endDate'),
                batchSessInput: $('batchSessInput'),
                specialStartDate: $('specialStartDate'),
                specialEndDate: $('specialEndDate'),
                specialSessInput: $('specialSessInput'),
                specialList: $('specialList'),
                jsonFile: $('jsonFile'),
                fileStatus: $('fileStatus'),
                statusText: $('statusText'),
                grandTotal: $('grandTotal'),
                statWorkdays: $('statWorkdays'),
                statHolidays: $('statHolidays'),
                statWeekendWork: $('statWeekendWork'),
                statTotalDays: $('statTotalDays'),
                btnCalcRange: $('btnCalcRange'),
                btnClearAll: $('btnClearAll'),
                btnClearSelected: $('btnClearSelected'),
                btnUndo: $('btnUndo'),
                btnBatchApply: $('btnBatchApply'),
                btnAddSpecial: $('btnAddSpecial'),
                btnClearJson: $('btnClearJson'),
                daysInputs: [...document.querySelectorAll('#daysRow input[data-d]')],
                weekdaySessInputs: [...document.querySelectorAll('#sessRow input[data-s]')],
            };

            const cellMap = new Map();

            // ==================== 工具函数 ====================
            function getDayOfWeek(dateStr) {
                const [y, m, d] = dateStr.split('-').map(Number);
                return new Date(y, m - 1, d).getDay();
            }

            function dateToStr(date) {
                const y = date.getFullYear();
                const m = String(date.getMonth() + 1).padStart(2, '0');
                const d = String(date.getDate()).padStart(2, '0');
                return `${y}-${m}-${d}`;
            }

            function parseDate(str) {
                if (!str) return null;
                const [y, m, d] = str.split('-').map(Number);
                const date = new Date(y, m - 1, d);
                if (isNaN(date.getTime())) return null;
                if (date.getMonth() !== m - 1 || date.getDate() !== d) return null;
                return date;
            }

            function formatDateInput(input) {
                if (!input) return null;
                const normalized = String(input).replace(/\//g, '-');
                const date = parseDate(normalized);
                if (!date) return null;
                return dateToStr(date);
            }

            function getRangeDates(startStr, endStr) {
                const start = parseDate(startStr);
                const end = parseDate(endStr);
                if (!start || !end) return [];
                const s = start <= end ? start : end;
                const e = start <= end ? end : start;
                const result = [];
                const cur = new Date(s);
                while (cur <= e) {
                    result.push(dateToStr(cur));
                    cur.setDate(cur.getDate() + 1);
                }
                return result;
            }

            function setStatus(msg) {
                dom.statusText.textContent = msg;
            }

            // ==================== 日历渲染 ====================
            let monthObserver = null;

            function renderCal(start, end) {
                if (start && end) {
                    state.renderRange = { start, end };
                } else {
                    start = state.renderRange.start;
                    end = state.renderRange.end;
                }

                const todayStr = dateToStr(new Date());
                const fragment = document.createDocumentFragment();
                cellMap.clear();

                const firstDay = start.getDay();
                const offset = firstDay === 0 ? 6 : firstDay - 1;
                for (let i = 0; i < offset; i++) {
                    const d = document.createElement('div');
                    d.className = 'day hide';
                    d.setAttribute('aria-hidden', 'true');
                    fragment.appendChild(d);
                }

                let lastMonth = -1;
                let todayCell = null;
                const cur = new Date(start);

                while (cur <= end) {
                    const ds = dateToStr(cur);
                    const m = cur.getMonth();
                    const cell = document.createElement('div');
                    cell.className = 'day';
                    cell.textContent = cur.getDate();
                    cell.dataset.date = ds;
                    cell.setAttribute('role', 'option');
                    cell.setAttribute('tabindex', '0');
                    cell.setAttribute('aria-label', `${cur.getFullYear()}年${m + 1}月${cur.getDate()}日`);
                    cell.setAttribute('aria-selected', state.selected.has(ds) ? 'true' : 'false');

                    if (m !== lastMonth) {
                        cell.classList.add('ph');
                        cell.dataset.m = `${m + 1}月`;
                        lastMonth = m;
                    }

                    if (ds === todayStr) {
                        cell.classList.add('today');
                        todayCell = cell;
                    }

                    if (state.selected.has(ds)) cell.classList.add('sel');
                    if (state.holidays.has(ds)) cell.classList.add('holiday');
                    if (state.weekendWorkdays.has(ds)) cell.classList.add('weekend-work');

                    cellMap.set(ds, cell);
                    fragment.appendChild(cell);
                    cur.setDate(cur.getDate() + 1);
                }

                for (let i = 0; i < 14; i++) {
                    const d = document.createElement('div');
                    d.className = 'day hide';
                    d.setAttribute('aria-hidden', 'true');
                    fragment.appendChild(d);
                }

                dom.calGrid.innerHTML = '';
                dom.calGrid.appendChild(fragment);

                if (todayCell) {
                    setTimeout(() => {
                        const scrollTarget = todayCell.offsetTop - (dom.calScroll.clientHeight / 2) + (todayCell.offsetHeight / 2);
                        dom.calScroll.scrollTo({ top: Math.max(0, scrollTarget), behavior: 'smooth' });
                    }, CONFIG.render.scrollDelay);
                }

                setupMonthObserver();
            }

            let monthUpdateRaf = null;
            let lastMonthYM = null;

            function setupMonthObserver() {
                if (monthObserver) monthObserver.disconnect();

                const monthMarkers = dom.calGrid.querySelectorAll('.day.ph');
                if (!monthMarkers.length) return;

                monthObserver = new IntersectionObserver((entries) => {
                    for (const entry of entries) {
                        if (entry.isIntersecting) {
                            const dateStr = entry.target.dataset.date;
                            if (dateStr) {
                                const [y, m] = dateStr.split('-');
                                const ym = `${y}-${m}`;
                                if (ym === lastMonthYM) break;
                                lastMonthYM = ym;

                                if (monthUpdateRaf) cancelAnimationFrame(monthUpdateRaf);
                                monthUpdateRaf = requestAnimationFrame(() => {
                                    dom.calTitle.textContent = `${y}年${parseInt(m)}月`;
                                    cellMap.forEach((cell, ds) => {
                                        cell.classList.toggle('out-of-month', !ds.startsWith(ym));
                                    });
                                });
                            }
                            break;
                        }
                    }
                }, {
                    root: dom.calScroll,
                    rootMargin: '-10% 0px -80% 0px',
                    threshold: 0
                });

                monthMarkers.forEach(marker => monthObserver.observe(marker));
            }

            // ==================== 计算引擎 ====================
            function computeStats() {
                const counts = [0, 0, 0, 0, 0, 0, 0];
                let workdays = 0, holis = 0, weekendWork = 0;
                let totalSessions = 0;

                const allDates = new Set([...state.selected, ...state.specialSessMap.keys()]);

                allDates.forEach(ds => {
                    const dow = getDayOfWeek(ds);
                    counts[dow]++;

                    const isWeekendWork = state.weekendWorkdays.has(ds);
                    const isWorkdayHoliday = !isWeekendWork && dow >= 1 && dow <= 5 && state.holidays.has(ds);
                    const isNormalWorkday = !isWeekendWork && !isWorkdayHoliday && dow >= 1 && dow <= 5;

                    if (isWorkdayHoliday) holis++;
                    if (isWeekendWork) weekendWork++;
                    if (isWeekendWork || isNormalWorkday) workdays++;

                    const sess = state.specialSessMap.has(ds)
                        ? state.specialSessMap.get(ds)
                        : (state.weekdaySess[dow] || 0);
                    totalSessions += sess;
                });

                return { counts, workdays, holis, weekendWork, totalDays: allDates.size, totalSessions };
            }

            // ==================== 渲染层 ====================
            function renderStats(stats) {
                dom.daysInputs.forEach(i => {
                    i.value = stats.counts[i.dataset.d];
                });
                dom.statWorkdays.textContent = stats.workdays;
                dom.statHolidays.textContent = stats.holis;
                dom.statWeekendWork.textContent = stats.weekendWork;
                dom.statTotalDays.textContent = stats.totalDays;
                dom.grandTotal.textContent = stats.totalSessions;
            }

            function syncUI() {
                cellMap.forEach((cell, ds) => {
                    const isSel = state.selected.has(ds);
                    cell.classList.toggle('sel', isSel);
                    cell.setAttribute('aria-selected', isSel ? 'true' : 'false');
                    cell.classList.toggle('holiday', state.holidays.has(ds));
                    cell.classList.toggle('weekend-work', state.weekendWorkdays.has(ds));
                });
                recalc();
            }

            function recalc() {
                renderStats(computeStats());
            }

            function syncSessInputs() {
                dom.weekdaySessInputs.forEach(i => {
                    i.value = state.weekdaySess[i.dataset.s];
                });
            }

            // ==================== 拖拽交互 ====================
            let lastDragRange = new Set();

            function highlightRange(startStr, endStr, isRemoveMode) {
                const newRange = new Set(getRangeDates(startStr, endStr));
                const modeClass = isRemoveMode ? 'drag-remove' : 'drag-add';
                const otherClass = isRemoveMode ? 'drag-add' : 'drag-remove';

                lastDragRange.forEach(d => {
                    if (!newRange.has(d)) {
                        const cell = cellMap.get(d);
                        if (cell) cell.classList.remove('drag-add', 'drag-remove');
                    }
                });

                newRange.forEach(d => {
                    const cell = cellMap.get(d);
                    if (cell) {
                        cell.classList.remove(otherClass);
                        cell.classList.add(modeClass);
                    }
                });

                lastDragRange = newRange;
            }

            function clearDragHighlight() {
                lastDragRange.forEach(d => {
                    const cell = cellMap.get(d);
                    if (cell) cell.classList.remove('drag-add', 'drag-remove');
                });
                lastDragRange = new Set();
            }

            function commitRange(startStr, endStr, wasSelected) {
                if (!startStr || !endStr) return;
                pushHistory();
                const dates = getRangeDates(startStr, endStr);
                dates.forEach(d => {
                    if (wasSelected) state.selected.delete(d);
                    else state.selected.add(d);
                });
                clearDragHighlight();
                syncUI();
            }

            function cellAtPoint(x, y) {
                const el = document.elementFromPoint(x, y);
                return el ? el.closest('.day:not(.hide)') : null;
            }

            function autoScroll(clientY) {
                const r = dom.calScroll.getBoundingClientRect();
                const { autoScrollEdge: edge, autoScrollSpeed: speed } = CONFIG.interaction;
                if (clientY < r.top + edge) dom.calScroll.scrollTop -= speed;
                else if (clientY > r.bottom - edge) dom.calScroll.scrollTop += speed;
            }

            // ==================== 鼠标交互 ====================
            const mouse = { down: false, start: null, wasSel: false, last: null };
            let lastTouchEndTime = 0;

            dom.calGrid.addEventListener('mousedown', (e) => {
                if (Date.now() - lastTouchEndTime < CONFIG.interaction.ghostClickGap) return;
                if (e.button !== 0) return;
                const cell = e.target.closest('.day:not(.hide)');
                if (!cell) return;

                e.preventDefault();
                mouse.down = true;
                mouse.start = cell.dataset.date;
                mouse.wasSel = cell.classList.contains('sel');
                mouse.last = mouse.start;
                highlightRange(mouse.start, mouse.start, mouse.wasSel);
            });

            document.addEventListener('mousemove', (e) => {
                if (!mouse.down) return;
                if (Date.now() - lastTouchEndTime < CONFIG.interaction.ghostClickGap) return;

                const cell = cellAtPoint(e.clientX, e.clientY);
                if (cell && cell.dataset.date) {
                    mouse.last = cell.dataset.date;
                    highlightRange(mouse.start, mouse.last, mouse.wasSel);
                }
                autoScroll(e.clientY);
            });

            document.addEventListener('mouseup', () => {
                if (!mouse.down) return;
                if (Date.now() - lastTouchEndTime < CONFIG.interaction.ghostClickGap) {
                    mouse.down = false;
                    clearDragHighlight();
                    return;
                }
                commitRange(mouse.start, mouse.last, mouse.wasSel);
                mouse.down = false;
                mouse.start = null;
            });

            dom.calGrid.addEventListener('contextmenu', e => e.preventDefault());

            // ==================== 触摸交互 ====================
            const touch = {
                active: false,
                dragMode: false,
                moved: false,
                start: null,
                wasSel: false,
                last: null,
                startX: 0,
                startY: 0,
                timer: null,
            };

            document.addEventListener('touchstart', () => {
                document.body.classList.add('touch-active');
            }, { passive: true });

            document.addEventListener('pointermove', (e) => {
                if (e.pointerType === 'mouse' && (Date.now() - lastTouchEndTime > CONFIG.interaction.ghostClickGap)) {
                    document.body.classList.remove('touch-active');
                }
            }, { passive: true });

            dom.calScroll.addEventListener('touchmove', (e) => {
                if (touch.dragMode) e.preventDefault();
            }, { passive: false });

            dom.calGrid.addEventListener('touchstart', (e) => {
                const t = e.touches[0];
                const cell = e.target.closest('.day:not(.hide)');
                if (!cell) return;

                touch.active = true;
                touch.dragMode = false;
                touch.moved = false;
                touch.startX = t.clientX;
                touch.startY = t.clientY;
                touch.start = cell.dataset.date;
                touch.wasSel = cell.classList.contains('sel');
                touch.last = touch.start;

                touch.timer = setTimeout(() => {
                    if (!touch.active) return;
                    touch.dragMode = true;
                    if (navigator.vibrate) navigator.vibrate(30);
                    cell.classList.add('pressing');
                    setTimeout(() => cell.classList.remove('pressing'), 150);
                    highlightRange(touch.start, touch.start, touch.wasSel);
                }, CONFIG.interaction.longPressMs);
            }, { passive: true });

            dom.calGrid.addEventListener('touchmove', (e) => {
                if (!touch.active) return;
                const t = e.touches[0];
                const dx = t.clientX - touch.startX;
                const dy = t.clientY - touch.startY;

                if (!touch.dragMode) {
                    if (Math.sqrt(dx * dx + dy * dy) > CONFIG.interaction.moveThreshold) {
                        clearTimeout(touch.timer);
                        touch.timer = null;
                        touch.moved = true;
                    }
                    return;
                }

                e.preventDefault();
                const cell = cellAtPoint(t.clientX, t.clientY);
                if (cell && cell.dataset.date) {
                    touch.last = cell.dataset.date;
                    highlightRange(touch.start, touch.last, touch.wasSel);
                }
                autoScroll(t.clientY);
            }, { passive: false });

            dom.calGrid.addEventListener('touchend', () => {
                lastTouchEndTime = Date.now();
                clearTimeout(touch.timer);
                touch.timer = null;

                if (touch.dragMode) {
                    commitRange(touch.start, touch.last, touch.wasSel);
                } else if (!touch.moved && touch.start) {
                    pushHistory();
                    if (state.selected.has(touch.start)) state.selected.delete(touch.start);
                    else state.selected.add(touch.start);
                    syncUI();
                }

                touch.active = false;
                touch.dragMode = false;
                touch.start = null;
            });

            dom.calGrid.addEventListener('touchcancel', () => {
                lastTouchEndTime = Date.now();
                clearTimeout(touch.timer);
                touch.timer = null;
                touch.active = false;
                touch.dragMode = false;
                touch.start = null;
                clearDragHighlight();
                dom.calGrid.querySelectorAll('.pressing').forEach(c => c.classList.remove('pressing'));
            });

            // ==================== 键盘导航 ====================
            dom.calGrid.addEventListener('keydown', (e) => {
                const cell = e.target.closest('.day:not(.hide)');
                if (!cell) return;

                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    pushHistory();
                    const ds = cell.dataset.date;
                    if (state.selected.has(ds)) state.selected.delete(ds);
                    else state.selected.add(ds);
                    syncUI();
                    return;
                }

                const dirMap = {
                    'ArrowLeft': -1,
                    'ArrowRight': 1,
                    'ArrowUp': -7,
                    'ArrowDown': 7,
                };

                if (dirMap[e.key] !== undefined) {
                    e.preventDefault();
                    const ds = cell.dataset.date;
                    const date = parseDate(ds);
                    if (!date) return;
                    date.setDate(date.getDate() + dirMap[e.key]);
                    const targetStr = dateToStr(date);
                    const targetCell = cellMap.get(targetStr);
                    if (targetCell) {
                        targetCell.focus();
                        targetCell.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                    }
                }
            });

            // ==================== 业务操作 ====================
            function calcRange() {
                const s = dom.startDate.value;
                const e = dom.endDate.value;

                if (!s) {
                    showInputError(dom.startDate);
                    setStatus('⚠️ 请输入开始日期');
                    return;
                }
                if (!e) {
                    showInputError(dom.endDate);
                    setStatus('⚠️ 请输入结束日期');
                    return;
                }

                pushHistory();

                const dates = getRangeDates(s, e);
                dates.forEach(d => state.selected.add(d));

                const allSelected = [...state.selected].sort();
                const minDate = parseDate(allSelected[0]);
                const maxDate = parseDate(allSelected[allSelected.length - 1]);
                const dayDiff = Math.round((maxDate - minDate) / 86400000);

                let renderStart, renderEnd;
                if (dayDiff >= CONFIG.render.maxRenderDays) {
                    renderStart = new Date(minDate.getFullYear(), minDate.getMonth(), 1);
                    renderEnd = new Date(minDate.getFullYear(), minDate.getMonth() + 12, 0);
                    setStatus(`📅 选中跨度 ${dayDiff + 1} 天，仅显示一年视图`);
                } else {
                    renderStart = new Date(minDate.getFullYear(), minDate.getMonth() - 1, 1);
                    renderEnd = new Date(maxDate.getFullYear(), maxDate.getMonth() + 2, 0);
                    setStatus(`已追加区间，当前共选中 ${state.selected.size} 天`);
                }

                renderCal(renderStart, renderEnd);
                syncUI();
            }

            function clearSelected() {
                pushHistory();
                state.selected.clear();
                syncUI();
                hideAllInputErrors();
                setStatus('已清除所有选中的日期');
            }

            // 「全部清除」：清除选中、特殊场次、单日场次配置，
            // 但保留硬编码和导入的排班数据
            function clearAll() {
                pushHistory();
                state.selected.clear();
                state.specialSessMap.clear();
                state.weekdaySess = { 1: 1, 2: 1, 3: 1, 4: 1, 5: 1, 6: 1, 0: 1 };

                renderSpecialList();
                syncSessInputs();

                dom.startDate.value = '';
                dom.endDate.value = '';
                dom.batchSessInput.value = '1';
                dom.specialStartDate.value = '';
                dom.specialEndDate.value = '';
                dom.specialSessInput.value = '1';

                syncUI();
                hideAllInputErrors();
                setStatus('已清空选中和场次配置（排班数据保留）');
            }

            function applyBatchSess() {
                const val = parseFloat(dom.batchSessInput.value) || 0;
                dom.weekdaySessInputs.forEach(input => {
                    const dow = input.dataset.s;
                    state.weekdaySess[dow] = val;
                    input.value = val;
                });
                recalc();
                setStatus(`已将所有单日场次批量设置为 ${val}`);
            }

            function addSpecialSess() {
                const startVal = dom.specialStartDate.value;
                const endVal = dom.specialEndDate.value;
                const sessVal = parseFloat(dom.specialSessInput.value) || 0;

                if (!startVal) {
                    showInputError(dom.specialStartDate);
                    setStatus('⚠️ 请选择特殊场次的开始日期');
                    return;
                }
                if (!endVal) {
                    showInputError(dom.specialEndDate);
                    setStatus('⚠️ 请选择特殊场次的结束日期');
                    return;
                }

                const s = startVal <= endVal ? startVal : endVal;
                const e = startVal <= endVal ? endVal : startVal;

                pushHistory();

                const dates = getRangeDates(s, e);
                dates.forEach(d => state.specialSessMap.set(d, sessVal));

                renderSpecialList();
                recalc();

                if (s === e) {
                    setStatus(`已为 ${s} 设置特殊场次: ${sessVal}`);
                } else {
                    setStatus(`已为 ${s} ~ ${e}（共 ${dates.length} 天）设置特殊场次: ${sessVal}`);
                }
            }

            function renderSpecialList() {
                dom.specialList.innerHTML = '';

                if (state.specialSessMap.size === 0) return;

                const entries = [...state.specialSessMap.entries()].sort((a, b) => a[0].localeCompare(b[0]));
                const groups = [];
                let groupStart = entries[0][0];
                let groupEnd = entries[0][0];
                let groupSess = entries[0][1];

                for (let i = 1; i < entries.length; i++) {
                    const [date, sess] = entries[i];
                    const prevDate = parseDate(groupEnd);
                    prevDate.setDate(prevDate.getDate() + 1);
                    const nextStr = dateToStr(prevDate);

                    if (date === nextStr && sess === groupSess) {
                        groupEnd = date;
                    } else {
                        groups.push({ start: groupStart, end: groupEnd, sess: groupSess });
                        groupStart = date;
                        groupEnd = date;
                        groupSess = sess;
                    }
                }
                groups.push({ start: groupStart, end: groupEnd, sess: groupSess });

                groups.forEach(g => {
                    const tag = document.createElement('span');
                    const label = g.start === g.end
                        ? `${g.start} (${g.sess}场)`
                        : `${g.start} ~ ${g.end} (${g.sess}场)`;
                    tag.textContent = label;
                    tag.title = '点击删除此区间';
                    tag.setAttribute('role', 'button');
                    tag.setAttribute('aria-label', `删除 ${label}`);
                    tag.addEventListener('click', () => {
                        pushHistory();
                        const dates = getRangeDates(g.start, g.end);
                        dates.forEach(d => state.specialSessMap.delete(d));
                        renderSpecialList();
                        recalc();
                        setStatus(`已删除 ${label}`);
                    });
                    dom.specialList.appendChild(tag);
                });
            }

            // ==================== JSON 文件处理 ====================
            function handleJsonUpload(e) {
                const file = e.target.files[0];
                if (!file) return;

                if (file.size > CONFIG.file.maxSizeKB * 1024) {
                    setFileStatus(`❌ 文件过大（限制 ${CONFIG.file.maxSizeKB}KB）`, false);
                    return;
                }

                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const data = JSON.parse(ev.target.result);

                        if (!data || typeof data !== 'object') throw new Error('JSON 根节点必须是对象');
                        if (!Array.isArray(data.holidays)) throw new Error('缺少 "holidays" 数组');
                        if (!Array.isArray(data.weekend_workdays)) throw new Error('缺少 "weekend_workdays" 数组');

                        // 只清空"导入"部分，硬编码保留
                        state.importedHolidays.clear();
                        state.importedWeekendWorkdays.clear();

                        data.holidays.forEach(h => {
                            const formatted = formatDateInput(h);
                            if (!formatted) throw new Error(`休息日格式错误：${h}`);
                            state.importedHolidays.add(formatted);
                        });

                        data.weekend_workdays.forEach(w => {
                            const formatted = formatDateInput(w);
                            if (!formatted) throw new Error(`补班日格式错误：${w}`);
                            state.importedWeekendWorkdays.add(formatted);
                        });

                        // 合并到生效数据
                        rebuildEffective();

                        // 统计合并结果
                        let realHolidays = 0;
                        state.holidays.forEach(ds => {
                            const dow = getDayOfWeek(ds);
                            if (dow >= 1 && dow <= 5) realHolidays++;
                        });

                        const fromDefaultH = DEFAULT_HOLIDAYS.length;
                        const fromImportH = state.importedHolidays.size;
                        const mergedH = state.holidays.size;
                        const overlapH = fromDefaultH + fromImportH - mergedH;

                        const fromDefaultW = DEFAULT_WEEKEND_WORKDAYS.length;
                        const fromImportW = state.importedWeekendWorkdays.size;
                        const mergedW = state.weekendWorkdays.size;
                        const overlapW = fromDefaultW + fromImportW - mergedW;

                        let msg = `✅ 公休: 硬编码 ${fromDefaultH} + 导入 ${fromImportH}`;
                        if (overlapH > 0) msg += `（重叠 ${overlapH}）`;
                        msg += ` | 周末班: 硬编码 ${fromDefaultW} + 导入 ${fromImportW}`;
                        if (overlapW > 0) msg += `（重叠 ${overlapW}）`;

                        setFileStatus(msg, true);
                        syncUI();

                    } catch (err) {
                        setFileStatus(`❌ ${err.message}`, false);
                    }
                };
                reader.onerror = () => setFileStatus('❌ 文件读取失败', false);
                reader.readAsText(file);
            }

            // 清除导入数据，回退到硬编码
            function clearJsonData() {
                state.importedHolidays.clear();
                state.importedWeekendWorkdays.clear();
                rebuildEffective();
                dom.jsonFile.value = '';
                dom.fileStatus.textContent = '';
                dom.fileStatus.className = 'file-status';
            }

            function setFileStatus(msg, ok) {
                dom.fileStatus.textContent = msg;
                dom.fileStatus.className = `file-status ${ok ? 'ok' : 'err'}`;
            }

            // ==================== 输入错误提示 ====================
            function showInputError(input) {
                hideAllInputErrors();
                input.classList.add('input-error', 'error-flash');
                input.addEventListener('animationend', () => {
                    input.classList.remove('error-flash');
                }, { once: true });
            }

            function hideAllInputErrors() {
                document.querySelectorAll('.input-error').forEach(el => {
                    el.classList.remove('input-error', 'error-flash');
                });
            }

            // ==================== 面板展开/收起 ====================
            function togglePanel() {
                dom.app.classList.toggle('collapsed');
                const isCollapsed = dom.app.classList.contains('collapsed');
                dom.toggleBtn.innerHTML = isCollapsed ? '▶' : '◀';
            }

            function mobileTogglePanel() {
                dom.app.classList.toggle('mobile-collapsed');
            }

            // ==================== 事件绑定 ====================
            dom.toggleBtn.addEventListener('click', togglePanel);
            dom.mobileExpandBtn.addEventListener('click', mobileTogglePanel);
            dom.mobileCollapseBtn.addEventListener('click', mobileTogglePanel);
            dom.btnCalcRange.addEventListener('click', calcRange);
            dom.btnClearAll.addEventListener('click', clearAll);
            dom.btnClearSelected.addEventListener('click', clearSelected);
            dom.btnUndo.addEventListener('click', undo);
            dom.btnBatchApply.addEventListener('click', applyBatchSess);
            dom.btnAddSpecial.addEventListener('click', addSpecialSess);
            dom.btnClearJson.addEventListener('click', () => {
                clearJsonData();
                syncUI();
                setStatus('已清除导入数据，恢复为硬编码');
            });
            dom.jsonFile.addEventListener('change', handleJsonUpload);

            dom.weekdaySessInputs.forEach(i => {
                i.addEventListener('input', () => {
                    const dow = i.dataset.s;
                    state.weekdaySess[dow] = parseFloat(i.value) || 0;
                    recalc();
                });
            });

            dom.startDate.addEventListener('change', () => {
                if (dom.startDate.value) {
                    dom.endDate.setAttribute('min', dom.startDate.value);
                    if (dom.startDate.value > dom.endDate.value) dom.endDate.value = '';
                } else {
                    dom.endDate.removeAttribute('min');
                }
            });

            dom.specialStartDate.addEventListener('change', () => {
                if (dom.specialStartDate.value) {
                    dom.specialEndDate.setAttribute('min', dom.specialStartDate.value);
                    if (!dom.specialEndDate.value) dom.specialEndDate.value = dom.specialStartDate.value;
                    if (dom.specialStartDate.value > dom.specialEndDate.value) {
                        dom.specialEndDate.value = '';
                    }
                } else {
                    dom.specialEndDate.removeAttribute('min');
                }
            });

            document.addEventListener('focusin', (e) => {
                if (e.target.matches('input')) {
                    hideAllInputErrors();
                    setTimeout(() => e.target.select(), 0);
                }
            });

            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
                    e.preventDefault();
                    undo();
                }
            });

            // ==================== 初始化 ====================
            rebuildEffective();   // 先合并硬编码，再渲染
            renderCal();
            syncSessInputs();
            recalc();

        })();
    </script>
</body>

</html>
