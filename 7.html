<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日历场次计算器</title>
    <style>
        :root {
            --primary: #3b82f6;
            --bg: #f3f4f6;
            --card: #fff;
            --border: #e5e7eb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: system-ui, sans-serif;
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #1f2937;
        }

        .app {
            display: flex;
            height: 600px;
            background: var(--card);
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
        }

        .cal-panel {
            width: 350px;
            min-width: 0;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            background: #fafafa;
            overflow: hidden;
        }

        .cal-header {
            padding: 15px;
            font-weight: bold;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cal-title {
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            padding: 10px 0;
            background: #fff;
            border-bottom: 1px solid var(--border);
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7,1fr);
            text-align: center;
            font-size: 13px;
            color: #6b7280;
            font-weight: 600;
            padding: 10px 10px 5px;
            border-bottom: 1px solid var(--border);
        }

        .cal-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            scrollbar-width: thin;
            scrollbar-color: #d1d5db #f9fafb;
        }

        .cal-scroll::-webkit-scrollbar { width: 6px; }
        .cal-scroll::-webkit-scrollbar-track { background: transparent; }
        .cal-scroll::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }

        .grid {
            display: grid;
            grid-template-columns: repeat(7,1fr);
            gap: 6px;
        }

        .day {
            padding: 10px 0;
            cursor: pointer;
            border-radius: 6px;
            font-size: 14px;
            text-align: center;
            transition: background 0.15s;
            user-select: none;
            position: relative;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: manipulation;
        }

        .day:hover { background: #e5e7eb; }
        .day.sel { background: var(--primary); color: #fff; }
        .day.out-of-month { color: #aaa !important; opacity: 0.6; }
        .day.drag { background: #93c5fd; color: #fff; }
        .day.pressing { background: #d1d5db !important; }
        .day.today { border: 1px solid var(--primary); }
        .day.hide { visibility: hidden; pointer-events: none; }

        .day.ph::before {
            content: attr(data-m);
            position: absolute;
            top: -2px; right: 2px;
            font-size: 9px;
            color: var(--primary);
            font-weight: bold;
        }
        .day.sel.ph::before { color: #fff; }

        .day::after {
            content: '';
            position: absolute;
            bottom: 2px; left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            font-weight: bold;
            line-height: 1;
        }
        .day.holiday::after { content: '休'; color: #3b82f6; }
        .day.weekend-work::after { content: '班'; color: #a87bf5; }
        .day.sel.holiday::after { color: #ef4444; }
        .day.sel.weekend-work::after { color: #f59e0b; }

        .cal-scroll.no-touch-scroll {
            touch-action: none !important;
            overscroll-behavior: none;
        }
    </style>
</head>

<body>
    <div class="app" id="app">
        <div class="cal-panel">
            <div class="cal-header"><span>🗓️ 日历</span></div>
            <div id="calTitle" class="cal-title">2026年7月</div>
            <div class="weekdays">
                <div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div>
            </div>
            <div class="cal-scroll" id="calScroll">
                <div class="grid" id="calGrid"></div>
            </div>
        </div>
    </div>

    <script>
        const calGrid = document.getElementById('calGrid');
        const calScroll = document.getElementById('calScroll');
        const calTitle = document.getElementById('calTitle');

        let selected = new Set();
        let holidays = new Set();
        let weekendWorkdays = new Set();

        const today = new Date();
        const todayStr = fmt(today);

        function fmt(d) {
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }

        /* ========== 状态变量 ========== */
        let mouseDown = false;
        let mouseDragStart = null;
        let mouseWasSel = false;
        let mouseLastHover = null;

        let touchActive = false;
        let touchTimer = null;
        let touchDragMode = false;   
        let touchDragStart = null;
        let touchWasSel = false;
        let touchLastHover = null;
        let touchStartX = 0, touchStartY = 0;
        let touchMoved = false;

        let lastTouchEndTime = 0;
        const GHOST_CLICK_GAP = 500;

        const MOVE_THRESHOLD = 10;
        const LONG_PRESS_MS = 400;

        /* ========== 工具函数 ========== */
        function getRange(s, e) {
            let a = new Date(Math.min(new Date(s).getTime(), new Date(e).getTime()));
            let b = new Date(Math.max(new Date(s).getTime(), new Date(e).getTime()));
            let r = [];
            while (a <= b) { r.push(fmt(a)); a.setDate(a.getDate()+1); }
            return r;
        }

        function cellAt(x, y) {
            const el = document.elementFromPoint(x, y);
            return el ? el.closest('.day:not(.hide)') : null;
        }

        function highlightRange(start, end) {
            document.querySelectorAll('.day.drag').forEach(c => c.classList.remove('drag'));
            if (!start || !end) return;
            getRange(start, end).forEach(d => {
                const c = calGrid.querySelector(`.day[data-date="${d}"]`);
                if (c) c.classList.add('drag');
            });
        }

        function commitRange(start, end, wasSel) {
            if (!start || !end) return;
            getRange(start, end).forEach(d => wasSel ? selected.delete(d) : selected.add(d));
            document.querySelectorAll('.day.drag').forEach(c => c.classList.remove('drag'));
            syncUI();
        }

        function syncUI() {
            document.querySelectorAll('.day').forEach(c => {
                if (c.dataset.date) c.classList.toggle('sel', selected.has(c.dataset.date));
            });
        }

        /* ========== 工具函数：清除残留视觉状态 ========== */
        function clearTouchVisuals() {
            document.querySelectorAll('.day.pressing,.day.drag').forEach(c =>
                c.classList.remove('pressing', 'drag'));
        }

        /* ========== 鼠标事件 ========== */
        calGrid.addEventListener('mousedown', (e) => {
            if (Date.now() - lastTouchEndTime < GHOST_CLICK_GAP) {
                return;
            }

            if (e.button !== 0) return;
            const cell = e.target.closest('.day:not(.hide)');
            if (!cell) return;

            e.preventDefault();
            mouseDown = true;
            mouseDragStart = cell.dataset.date;
            mouseWasSel = cell.classList.contains('sel');
            mouseLastHover = mouseDragStart;
            highlightRange(mouseDragStart, mouseDragStart);
        });

        document.addEventListener('mousemove', (e) => {
            if (!mouseDown) return;
            if (Date.now() - lastTouchEndTime < GHOST_CLICK_GAP) return;
            
            const cell = cellAt(e.clientX, e.clientY);
            if (cell && cell.dataset.date) {
                mouseLastHover = cell.dataset.date;
                highlightRange(mouseDragStart, mouseLastHover);
            }
            const r = calScroll.getBoundingClientRect();
            if (e.clientY < r.top + 30) calScroll.scrollTop -= 12;
            else if (e.clientY > r.bottom - 30) calScroll.scrollTop += 12;
        });

        document.addEventListener('mouseup', () => {
            if (!mouseDown) return;
            if (Date.now() - lastTouchEndTime < GHOST_CLICK_GAP) {
                mouseDown = false;
                mouseDragStart = null;
                return;
            }
            commitRange(mouseDragStart, mouseLastHover, mouseWasSel);
            mouseDown = false;
            mouseDragStart = null;
        });

        calGrid.addEventListener('contextmenu', (e) => e.preventDefault());

        /* ========== 触摸事件 ========== */

        calScroll.addEventListener('touchmove', (e) => {
            if (touchDragMode) {
                e.preventDefault();
            }
        }, { passive: false });

        calGrid.addEventListener('touchstart', (e) => {
            const t = e.touches[0];
            const cell = e.target.closest('.day:not(.hide)');
            if (!cell) return;

            touchActive = true;
            touchDragMode = false;
            touchMoved = false;
            touchStartX = t.clientX;
            touchStartY = t.clientY;
            touchDragStart = cell.dataset.date;
            touchWasSel = cell.classList.contains('sel');
            touchLastHover = touchDragStart;

            touchTimer = setTimeout(() => {
                if (!touchActive) return;
                touchDragMode = true;

                if (navigator.vibrate) navigator.vibrate(30);

                cell.classList.add('pressing');
                setTimeout(() => cell.classList.remove('pressing'), 150);

                calScroll.classList.add('no-touch-scroll');

                highlightRange(touchDragStart, touchDragStart);
            }, LONG_PRESS_MS);

        }, { passive: true });

        calGrid.addEventListener('touchmove', (e) => {
            if (!touchActive) return;
            const t = e.touches[0];
            const dx = t.clientX - touchStartX;
            const dy = t.clientY - touchStartY;

            if (!touchDragMode) {
                if (Math.sqrt(dx*dx + dy*dy) > MOVE_THRESHOLD) {
                    clearTimeout(touchTimer);
                    touchTimer = null;
                    touchMoved = true;
                }
                return;
            }

            e.preventDefault();

            const cell = cellAt(t.clientX, t.clientY);
            if (cell && cell.dataset.date) {
                touchLastHover = cell.dataset.date;
                highlightRange(touchDragStart, touchLastHover);
            }

            const r = calScroll.getBoundingClientRect();
            if (t.clientY < r.top + 40) {
                calScroll.scrollTop -= 8;
                requestAnimationFrame(() => {
                    const c2 = cellAt(t.clientX, t.clientY);
                    if (c2 && c2.dataset.date) {
                        touchLastHover = c2.dataset.date;
                        highlightRange(touchDragStart, touchLastHover);
                    }
                });
            } else if (t.clientY > r.bottom - 40) {
                calScroll.scrollTop += 8;
                requestAnimationFrame(() => {
                    const c2 = cellAt(t.clientX, t.clientY);
                    if (c2 && c2.dataset.date) {
                        touchLastHover = c2.dataset.date;
                        highlightRange(touchDragStart, touchLastHover);
                    }
                });
            }

        }, { passive: false });

        calGrid.addEventListener('touchend', () => {
            lastTouchEndTime = Date.now();

            clearTimeout(touchTimer);
            touchTimer = null;

            /* 【修复】在任何分支之前，先清除所有残留的 pressing 和 drag 样式 */
            clearTouchVisuals();

            if (touchDragMode) {
                commitRange(touchDragStart, touchLastHover, touchWasSel);
                calScroll.classList.remove('no-touch-scroll');
            } else if (!touchMoved && touchDragStart) {
                if (selected.has(touchDragStart)) selected.delete(touchDragStart);
                else selected.add(touchDragStart);
                syncUI();
            }

            touchActive = false;
            touchDragMode = false;
            touchDragStart = null;
        });

        calGrid.addEventListener('touchcancel', () => {
            lastTouchEndTime = Date.now();
            
            clearTimeout(touchTimer);
            touchTimer = null;
            touchActive = false;
            touchDragMode = false;
            touchDragStart = null;
            calScroll.classList.remove('no-touch-scroll');
            clearTouchVisuals();
        });

        /* ========== 渲染日历 ========== */
        function renderCal(cStart, cEnd) {
            calGrid.innerHTML = '';
            const start = cStart || new Date(today.getFullYear(), today.getMonth()-3, 1);
            const end = cEnd || new Date(today.getFullYear(), today.getMonth()+6, 0);
            let cur = new Date(start), lastM = -1;

            const off = cur.getDay() === 0 ? 6 : cur.getDay()-1;
            for (let i = 0; i < off+21; i++) {
                const d = document.createElement('div');
                d.className = 'day hide';
                calGrid.appendChild(d);
            }

            let todayCell = null;

            while (cur <= end) {
                const y = cur.getFullYear(), m = cur.getMonth(), dt = cur.getDate();
                const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(dt).padStart(2,'0')}`;
                const cell = document.createElement('div');
                cell.className = 'day';
                cell.textContent = dt;
                cell.dataset.date = ds;

                if (m !== start.getMonth()) cell.classList.add('out-of-month');

                if (m !== lastM) {
                    cell.classList.add('ph');
                    cell.dataset.m = `${m+1}月`;
                    lastM = m;
                }

                if (ds === todayStr) { cell.classList.add('today'); todayCell = cell; }
                if (selected.has(ds)) cell.classList.add('sel');
                if (holidays.has(ds)) cell.classList.add('holiday');
                if (weekendWorkdays.has(ds)) cell.classList.add('weekend-work');

                calGrid.appendChild(cell);
                cur.setDate(cur.getDate()+1);
            }

            for (let i = 0; i < 28; i++) {
                const d = document.createElement('div');
                d.className = 'day hide';
                calGrid.appendChild(d);
            }

            setTimeout(() => {
                if (todayCell) {
                    const st = todayCell.offsetTop - (calScroll.clientHeight/2) + (todayCell.offsetHeight/2);
                    calScroll.scrollTo({ top: st, behavior: 'smooth' });
                }
            }, 50);

            calScroll.removeEventListener('scroll', updateCalTitle);
            calScroll.addEventListener('scroll', updateCalTitle);
            updateCalTitle();
        }

        function updateCalTitle() {
            const containerTop = calScroll.getBoundingClientRect().top;
            const triggerTop = containerTop + 150;
            const days = document.querySelectorAll('.day');
            if (!days.length) return;

            let curYear, curMonth;
            for (let i = 0; i < days.length; i++) {
                const dayTop = days[i].getBoundingClientRect().top;
                if (dayTop < triggerTop) continue;
                const ds = days[i].dataset.date;
                if (ds) { [curYear, curMonth] = ds.split('-'); }
                break;
            }
            if (!curYear || !curMonth) return;

            const ym = `${curYear}-${curMonth}`;
            days.forEach(day => {
                const ds = day.dataset.date;
                if (ds && ds.startsWith(ym)) day.classList.remove('out-of-month');
                else day.classList.add('out-of-month');
            });

            calTitle.innerText = `${curYear}年${parseInt(curMonth)}月`;
        }

        renderCal();
    </script>
</body>
</html>
